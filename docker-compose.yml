version: "3.8"

services:
  youtube-local:
    build: .
    container_name: youtube-local
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    networks:
      - ytlocal

  nginx:
    image: nginx:alpine
    container_name: youtube-local-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - youtube-local
    networks:
      - ytlocal

networks:
  ytlocal:
    driver: bridge
